<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrueShop Admin</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin">

<!-- ============ LOGIN ============ -->
<div id="login" class="login-screen" hidden>
  <form class="login-card" id="loginForm">
    <div class="logo" style="justify-content:center;margin-bottom:6px"><span class="logo-mark">T</span><span style="color:var(--green-800)">TRUESHOP</span></div>
    <h2 style="text-align:center;margin-bottom:4px">Admin sign in</h2>
    <p class="small muted" style="text-align:center">Demo credentials are pre-filled. Just press Sign in.</p>
    <label class="field">Admin ID<input id="lu" value="admin" autocomplete="username"></label>
    <label class="field">Password<input id="lp" type="password" value="trueshop@2026" autocomplete="current-password"></label>
    <div class="small" id="capsWarn" style="color:var(--warn);min-height:1.3em"></div>
    <button class="btn btn-gold" style="width:100%">Sign in</button>
    <p class="tiny muted" style="margin:14px 0 0;text-align:center">Demo only: this sign-in runs in the browser and is not real security. A production admin needs server-side authentication.</p>
    <p class="tiny" style="text-align:center;margin:8px 0 0"><a href="index.html">← Back to TrueShop</a></p>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app" class="admin-app" hidden>
  <aside class="side" id="side">
    <div class="side-brand"><a class="logo" href="#dashboard"><span class="logo-mark">T</span>TRUESHOP</a><span class="chip chip-gold" style="margin-left:auto">ADMIN</span></div>
    <nav id="sideNav"></nav>
    <div class="side-foot"><a href="index.html" target="_blank">↗ View storefront</a></div>
  </aside>
  <div class="side-scrim" id="scrim"></div>

  <div class="main">
    <header class="abar">
      <button class="icon-btn" id="burger" aria-label="Menu">☰</button>
      <div class="crumbs" id="crumbs"></div>
      <div class="search"><input id="gsearch" placeholder="Search member ID or name…" autocomplete="off"><div class="search-res" id="gres" hidden></div></div>
      <button class="icon-btn" id="themeBtn" title="Toggle light/dark theme">🌓</button>
      <button class="icon-btn notif" id="notifBtn" title="Notifications">🔔<span id="notifCount"></span></button>
      <div class="abar-me"><div class="abar-me-av">A</div><div class="abar-me-txt"><b>Super Admin</b><span class="tiny muted">admin</span></div><button class="btn btn-ghost btn-sm" id="logout">Logout</button></div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<script src="assets/js/plan.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/admin-data.js"></script>
<script src="assets/js/clinic-data.js"></script>
<script src="assets/js/admin-clinics.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
